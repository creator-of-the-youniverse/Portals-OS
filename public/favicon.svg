<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="512" height="512" rx="128" fill="#050508" />

  <!-- Outer Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#portalGlow)" />

  <!-- Outer Dynamic Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="16 10" filter="url(#neonGlow)" />

  <!-- Inner Portal Vortex Rings -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00ffff" stroke-width="4" stroke-opacity="0.7" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#a855f7" stroke-width="5" stroke-opacity="0.9" />

  <!-- Central Sovereign Core "ONE" / Youniverse Sphere -->
  <circle cx="256" cy="256" r="48" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="32" fill="url(#ringGrad)" />
</svg>
